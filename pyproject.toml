[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-fairness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",          # torch.onnx.export(..., dynamo=False)
  "torchvision>=0.20",
  "timm>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pillow>=10",
  "imagehash>=4.3",
  "requests>=2.32",
  "tqdm>=4.66",
  "pyyaml>=6",
  "pydantic>=2.7",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxconverter-common>=1.14",
  "grad-cam>=1.5",
]

[project.optional-dependencies]
vlm = ["anthropic>=0.70", "transformers>=4.50", "accelerate>=1.0", "bitsandbytes>=0.43"]
dev = ["pytest>=8", "kaggle>=1.7", "six"]

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
